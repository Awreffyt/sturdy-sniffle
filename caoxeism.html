// ==================== Weather System ====================
const WEATHERS={
    clear:{name:'晴朗',  wind:0.3, snowAlpha:0.4, coldMult:1.0, fogDens:0.0008, color:0x87CEEB, skyAlpha:0.5, lightMult:1.0},
    cloudy:{name:'多云', wind:0.6, snowAlpha:0.6, coldMult:1.3, fogDens:0.0028, color:0x9aa8b8, skyAlpha:0.85, lightMult:0.7},
    foggy:{name:'大雾',  wind:0.2, snowAlpha:0.5, coldMult:1.4, fogDens:0.012, color:0xbac8d0, skyAlpha:0.95, lightMult:0.5},
    blizzard:{name:'暴风雪',wind:1.5, snowAlpha:1.0, coldMult:2.2, fogDens:0.006, color:0xb8c4d0, skyAlpha:1.0, lightMult:0.4}
};
const WEATHER_KEYS=Object.keys(WEATHERS);
function pickWeather(curId){
    const idx=WEATHER_KEYS.indexOf(curId);
    let next;
    do{ next=WEATHER_KEYS[Math.floor(Math.random()*WEATHER_KEYS.length)]; }
    while(next===curId && Math.random()<0.5);
    return next;
}
// [地面积雪] 不同天气的平衡积雪量: 暴风雪堆满, 晴天只剩阴坡残雪
const SNOW_ACCUM_TARGET={blizzard:1.0, cloudy:0.62, foggy:0.52, clear:0.38};
function updateSnowAccum(dt){
    const tgt=SNOW_ACCUM_TARGET[gameState.weatherId]!==undefined
        ? SNOW_ACCUM_TARGET[gameState.weatherId] : 0.2;
    const cur=gameState.snowAccum;
    // 积雪慢(雪要一片片堆), 消融更慢(化雪比下雪费时) —— 这样天气转晴后
    // 地上还会留一阵子残雪, 而不是瞬间消失
    const rate=(tgt>cur)?0.055:0.022;
    gameState.snowAccum+= (tgt-cur)*Math.min(1, dt*rate);
    if(gameState.snowAccum<0)gameState.snowAccum=0;
    else if(gameState.snowAccum>1)gameState.snowAccum=1;
    // 消融中的残雪更斑驳(数值越接近"正在化开"越碎)
    const melting=(tgt<cur)?1.0:0.0;
    gameState.snowMelt+=(melting-gameState.snowMelt)*Math.min(1, dt*0.03);
    terrainUniforms.uSnowAccum.value=gameState.snowAccum;
    terrainUniforms.uSnowMelt.value =gameState.snowMelt;
}
function updateWeather(dt){
    updateSnowAccum(dt);
    gameState.weatherTimer-=dt;
    if(gameState.weatherTimer<=0){
        const newId=pickWeather(gameState.weatherId);
        if(newId!==gameState.weatherId){
            const w=WEATHERS[newId];
            gameState.weatherId=newId;
            gameState.totalWeatherChanges++;
            showSubtitle(`天气变化 —— 转为「${w.name}」`);
        }
        gameState.weatherTimer=30+Math.random()*60;
    }
}

// ==================== Audio (WebAudio) ====================
let audioCtx=null;
function initAudio(){
    if(audioCtx) return;
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function playWind(level){
    if(!audioCtx) return;
    if(audioCtx.state==='suspended') audioCtx.resume();
    if(!playWind._node){
        const buf=audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.3;
        const src=audioCtx.createBufferSource(); src.buffer=buf; src.loop=true;
        const filt=audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=400;
        const g=audioCtx.createGain(); g.gain.value=0;
        src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
        src.start();
        playWind._node={src, g, filt};
    }
    playWind._node.g.gain.value=Math.min(0.15, level*0.08);
    playWind._node.filt.frequency.value=200+level*600;
}
function playHowl(){
    if(!audioCtx) return;
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(); o.type='sine'; o.frequency.value=180;
    const o2=audioCtx.createOscillator(); o2.type='sine'; o2.frequency.value=220;
    const g=audioCtx.createGain(); g.gain.value=0;
    o.connect(g); o2.connect(g); g.connect(audioCtx.destination);
    o.start(); o2.start();
    o.frequency.linearRampToValueAtTime(280, audioCtx.currentTime+0.3);
    o.frequency.linearRampToValueAtTime(160, audioCtx.currentTime+1.5);
    g.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime+0.2);
    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+1.8);
    o.stop(audioCtx.currentTime+2); o2.stop(audioCtx.currentTime+2);
}
document.addEventListener('click', initAudio, {once:true});
document.addEventListener('touchstart', initAudio, {once:true});

// ==================== 自适应性能(动态分辨率) ====================
// 默认永远跑档位上限(最高 3K); 仅当实测帧率不足时临时降低内部渲染分辨率,
// 帧率恢复后自动逐步还原 —— 属于"帧率/分辨率"的自动平衡, 而非固定降质。
const perf={fps:60,frames:0,acc:0,scale:1.0,lastChange:0};
function applyResolution(){
    renderer.setPixelRatio(Math.max(0.55, Math.min(window.devicePixelRatio, PERF.dprCap)*perf.scale*PERF.resScale));  // [4K] resScale 超采样
}
function updateAdaptivePerf(dt){
    perf.frames++; perf.acc+=dt;
    if(perf.acc<1.0) return;
    perf.fps=perf.frames/perf.acc;
    perf.frames=0; perf.acc=0;
    if(gameState.time-perf.lastChange<2.5) return;      // 冷却, 避免来回震荡
    if(perf.fps<42 && perf.scale>0.55){
        perf.scale=Math.max(0.55, perf.scale-0.15); perf.lastChange=gameState.time; applyResolution();
    }else if(perf.fps>58 && perf.scale<1.0){
        perf.scale=Math.min(1.0, perf.scale+0.10); perf.lastChange=gameState.time; applyResolution();
    }
}

// ==================== Main Loop ====================
let lastTime=0;
let mapUpdateTimer=0;
let howlTimer=0;

function animate(time){
    requestAnimationFrame(animate);
    if(!gameState.gameStarted)return;
    const delta=Math.min((time-lastTime)/1000, 0.1);
    lastTime=time;
    gameState.time+=delta;
    updateAdaptivePerf(delta);
    gameState.dayTime=(gameState.time/DAY_DURATION)%1;

    const forward=new THREE.Vector3(0,0,-1);
    const eulerY=new THREE.Euler(0, gameState.rotation.y, 0);
    forward.applyEuler(eulerY);
    const right=new THREE.Vector3(1,0,0);
    right.applyEuler(eulerY);

    let moveVec=new THREE.Vector3();
    if(keys.KeyW||joystickVec.y<-0.3)moveVec.add(forward);
    if(keys.KeyS||joystickVec.y>0.3)moveVec.sub(forward);
    if(keys.KeyA||joystickVec.x<-0.3)moveVec.sub(right);
    if(keys.KeyD||joystickVec.x>0.3)moveVec.add(right);

    gameState.isMoving=moveVec.length()>0.1;

    if(gameState.isMoving){
        moveVec.normalize();
        const spd=gameState.isSprinting&&gameState.stamina>0?SPRINT_SPEED:BASE_SPEED;
        gameState.velocity.x=moveVec.x*spd;
        gameState.velocity.z=moveVec.z*spd;
        if(gameState.isSprinting)gameState.stamina=Math.max(0, gameState.stamina-delta*14);
    }else{
        gameState.velocity.x*=0.82;
        gameState.velocity.z*=0.82;
        gameState.stamina=Math.min(100, gameState.stamina+delta*8);
    }

    if(keys.Space&&gameState.isGrounded&&gameState.jumpCooldown<=0){
        gameState.velocity.y=JUMP_FORCE;
        gameState.isGrounded=false;
        gameState.jumpCooldown=0.4;
    }
    if(gameState.jumpCooldown>0)gameState.jumpCooldown-=delta;
    gameState.velocity.y-=GRAVITY*delta;

    const oldPos=gameState.position.clone();
    const newPos=gameState.position.clone();
    newPos.x+=gameState.velocity.x*delta;
    newPos.z+=gameState.velocity.z*delta;
    newPos.y+=gameState.velocity.y*delta;
    gameState.position=resolveCollision(oldPos, newPos, 0.5, PLAYER_HEIGHT);

    if(gameState.isMoving && gameState.isGrounded){
        addFootprint(gameState.position.x, getTerrainHeight(gameState.position.x, gameState.position.z), gameState.position.z);
    }
    updateFootprints(delta);

    camera.position.copy(gameState.position);
    camera.rotation.copy(gameState.rotation);

    if(lookActive||document.pointerLockElement){
        const sens=0.0022;
        gameState.rotation.y-=lookDelta.x*sens;
        gameState.rotation.x-=lookDelta.y*sens;
        gameState.rotation.x=Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, gameState.rotation.x));
        lookDelta={x:0,y:0};
    }

    // === 太阳阴影跟随 ===
    sunLight.position.set(gameState.position.x+sunDir.x*400, sunDir.y*400, gameState.position.z+sunDir.z*400);
    sunLight.target.position.copy(gameState.position);
    sunLight.target.updateMatrixWorld();
    const sh=sunLight.shadow.camera;
    sh.left=gameState.position.x-500;
    sh.right=gameState.position.x+500;
    sh.top=gameState.position.z+500;
    sh.bottom=gameState.position.z-500;
    sunLight.shadow.camera.updateProjectionMatrix();

    // === 天气 ===
    updateWeather(delta);
    const w=WEATHERS[gameState.weatherId];

    // === 时间系统 ===
    const t=gameState.dayTime;
    const sunY=Math.sin(t*Math.PI*2);
    const sunAng=t*Math.PI*2;
    sunDir.set(Math.cos(sunAng), Math.max(sunY, -0.2), Math.sin(sunAng)*0.4).normalize();
    const isNight=sunY<-0.05;

    // === 金霞强度: 日出日落前后峰值(提前算, 供光照/云/雾共用) ===
    let golden=0.0;
    if(sunY>=-0.15 && sunY<0.3){
        const gt=Math.max(0, 1.0-Math.abs(sunY-0.02)/0.28);
        golden=Math.min(1, gt*1.15);
    }
    // 太阳强度:白天强,夜晚 0; [金霞] 日出日落保持低角度暖阳, 否则山体全黑剪影
    let dayIntensity=Math.max(0, sunY);
    if(t<0.25 || t>0.75){
        // 黄昏/黎明
        const tn=t<0.25?t:t-1;
        dayIntensity=Math.max(0, Math.sin(tn*Math.PI*2)*0.5);
    }
    dayIntensity=Math.max(dayIntensity, golden*0.62);
    // [真实感] 光强按 ACES 曲线重新标定: 原来 ×4.0 会把雪面/岩石直接推到死白, 高光没有任何层次
    const sunLightMult=dayIntensity * w.lightMult * 1.35;
    sunLight.intensity=sunLightMult + (isNight?0.22:0);   // [修复] 夜晚月光, 不再死黑
    hemiLight.intensity=(isNight?0.28:Math.max(0.08, dayIntensity*0.26+0.06)) * (0.4+w.lightMult*0.6);
    fillLight.intensity=Math.max(0.05, dayIntensity*0.14);

    // 太阳颜色(黄昏偏橙,正午偏白)
    let sunCol;
    if(sunY>0.3){
        sunCol=new THREE.Color(0xfff5d4); // 正午暖白
    } else if(sunY>-0.05){
        sunCol=new THREE.Color().setHSL(0.055, 0.92, 0.5+dayIntensity*0.18); // [金霞] 低角度深橙
    } else {
        sunCol=new THREE.Color(0x6080a0); // 夜晚冷蓝
    }
    sunLight.color.copy(sunCol);
    skyUniforms.uSunColor.value.copy(sunCol);
    skyUniforms.uSunDir.value.copy(sunDir);
    skyUniforms.uSunIntensity.value=Math.max(dayIntensity*1.5, golden*1.1);  // [金霞] 地平线太阳不熄灭
    skyUniforms.uTime.value=gameState.time*0.02;
    skyUniforms.uStars.value=isNight?0.9:0.0;
    skyUniforms.uMoonAlpha.value=isNight?1.0:0.0;
    skyUniforms.uNight.value=THREE.MathUtils.clamp((-sunY-0.03)/0.2, 0, 1);  // [FIX-夜黑碎片] 平滑过渡

    // 太阳天空盒位置更新
    skyUniforms.uZenith.value.setHSL(0.6, 0.7, 0.3+dayIntensity*0.2);
    skyUniforms.uHorizon.value.setHSL(0.55, 0.5, 0.7+dayIntensity*0.15);

    // (golden 已在上文计算)
    skyUniforms.uGolden.value=golden;
    gameState.golden=golden;  // [金霞] 供雪/雾粒子门控
    skyUniforms.uCirrus.value=0.45+golden*0.5+w.skyAlpha*0.3;
    skyUniforms.uTurbidity.value=2.0+golden*2.5;
    const goldenCol=new THREE.Color().setHSL(0.06, 0.9, 0.5+golden*0.12);  // [金霞] 深金橙
    skyUniforms.uGoldenColor.value.copy(goldenCol);

    // 太阳 DOM glow
    const sunGlowEl=document.getElementById('sunGlow');
    sunGlowEl.style.opacity=Math.max(0, dayIntensity)*0.7 * w.lightMult;
    const sgX=50+sunDir.x*30;
    const sgY=85-sunDir.y*45;
    const sgR=Math.floor(255);
    const sgG=Math.floor(150+sunY*80);
    const sgB=Math.floor(80+sunY*120);
    sunGlowEl.style.background=`radial-gradient(ellipse at ${sgX}% ${sgY}%,rgba(${sgR},${sgG},${sgB},0.4)0%,transparent 55%)`;

    document.getElementById('dayNightOverlay').style.opacity=isNight?0.7:0;

    // 雾色随天气
    scene.fog.density=w.fogDens;
    scene.fog.color.setHex(w.color);
    if(isNight) scene.fog.color.lerp(new THREE.Color(0x35496b), 0.55);  // [修复] 夜雾带月光蓝, 消黑碎片
    if(t<0.25 || t>0.75){
        const duskCol=new THREE.Color(0x806050);
        scene.fog.color.lerp(duskCol, 0.5+golden*0.3);  // [金霞] 雾气也染金
    }

    // 雪粒子 — [性能-GPU雪] CPU 每帧只传 5 个 uniform, 不再遍历上万粒子+回写 108KB 缓冲
    const px=gameState.position.x, pz=gameState.position.z, py=gameState.position.y;
    snowMat.uniforms.uOpacity.value=0.45+w.snowAlpha*0.45;
    snowMat.uniforms.uTime.value=gameState.time;
    snowMat.uniforms.uPlayerPos.value.copy(gameState.position);
    snowMat.uniforms.uWind.value=Math.sin(gameState.time*0.3)*w.wind*2.2+w.wind*0.6;
    snowMat.uniforms.uGolden.value=golden;
    snowMat.uniforms.uGoldenColor.value.copy(goldenCol);

    // === [3K] 冰晶/雾气体积粒子(随高度/天气淡入) ===
    if(mistSystem){
        mistSystem.position.set(px, 0, pz);
        const groundH=getTerrainHeight(px, pz);
        const altitudeF=Math.max(0, Math.min(1, (groundH-120)/260));
        mistMat.opacity=Math.min(0.11,(0.035+altitudeF*0.09)*(0.6+w.snowAlpha*0.7)*(1-(gameState.golden||0)*0.55));  // [金霞] 雾气不糊霞光
        const mp=mistSystem.geometry.attributes.position.array;
        for(let i=0;i<mistCount;i++){
            mp[i*3+1]-=delta*0.4;
            if(mp[i*3+1]<py-8) mp[i*3+1]=py+8+Math.random()*12;
        }
        mistSystem.geometry.attributes.position.needsUpdate=true;
    }

    // 红旗飘动([PERF] 只遍历已缓存的 3 面旗, 不再 traverse 全场景)
    {
        const t=gameState.time*3;
        for(let fi=0;fi<flagMeshes.length;fi++){
            const obj=flagMeshes[fi];
            const pos=obj.geometry.attributes.position;
            if(pos){
                for(let i=0;i<pos.count;i++){
                    const px0=pos.getX(i);
                    pos.setZ(i, Math.sin(px0*4+t)*0.15*w.wind);
                }
                pos.needsUpdate=true;
            }
        }
    }

    // 篝火动画
    bonfires.forEach(b=>{
        const u=b.userData;
        if(u.flame){
            const s=0.8+Math.sin(gameState.time*8+b.position.x)*0.2;
            u.flame.scale.set(s, 1+Math.sin(gameState.time*6+b.position.z)*0.15, s);
            u.flame2.scale.set(s*0.8, 0.8+Math.sin(gameState.time*10)*0.2, s*0.8);
        }
    });

    // 远山跟随
    distantMountains.position.set(px, 0, pz);
    // [修复-夜景远山] 夜间把低模远山压暗融入夜雾, 消除月光下的多边形楔形
    if(distantMountains.userData.nf===undefined)distantMountains.userData.nf=1.0;
    const _nt=isNight?0.35:1.0;
    distantMountains.userData.nf+=(_nt-distantMountains.userData.nf)*Math.min(1,delta*2.0);
    const _nf=distantMountains.userData.nf;
    for(let _ci=0;_ci<distantMountains.children.length;_ci++){
        const _cm=distantMountains.children[_ci];
        if(_cm.userData.bo!==undefined){
            _cm.material.opacity=_cm.userData.bo*_nf;
            _cm.material.color.setHex(_cm.userData.bc).multiplyScalar(0.35+0.65*_nf);
        }
    }

    // 云海
    cloudUniforms.uTime.value=gameState.time;
    cloudUniforms.uCameraPos.value.set(px, py, pz);
    cloudUniforms.uDensity.value=(0.5+w.skyAlpha*0.4)*(1.0-golden*0.6);  // [金霞] 云盖让开霞光
    cloudUniforms.uGolden.value=golden;   // [FIX] 金霞染云联动
    cloudLayers.forEach((l, i)=>{
        l.position.x=px;
        l.position.z=pz;
        l.visible=py < l.position.y+10;
    });

    // terrain shader uniforms
    terrainUniforms.uSunDir.value.copy(sunDir);
    terrainUniforms.uSunColor.value.copy(sunCol);
    terrainUniforms.uSunIntensity.value=sunLightMult;
    terrainUniforms.uTime.value=gameState.time;
    terrainUniforms.uCameraPos.value.copy(camera.position);
    // === [3K] 金霞 + 视距 + 粗糙度 + 雾色 ===
    terrainUniforms.uGolden.value=golden;
    terrainUniforms.uGoldenColor.value.copy(goldenCol);
    terrainUniforms.uViewDistance.value=1500.0;
    terrainUniforms.uSnowRoughness.value=0.78-w.snowAlpha*0.1;
    terrainUniforms.uRockRoughness.value=0.92;
    terrainUniforms.uSkyColor.value.copy(scene.fog.color).lerp(goldenCol, golden*0.45);
    // === [真实感] 天空光 / 大气透视 / 曝光 与场景同步(原来这些值是写死的, 天光一变地形就不跟) ===
    terrainUniforms.uSkyIntensity.value=0.28+dayIntensity*0.32;
    terrainUniforms.uFogDensity.value=scene.fog.density;
    terrainUniforms.uFogColor.value.copy(scene.fog.color);
    terrainUniforms.uExposure.value=1.12;
    terrainUniforms.uSnowRoughness.value=0.78-w.snowAlpha*0.10;   // 湿雪/新雪反光更强
    // [FIX] 雪粒子强度 = 天气 × 海拔(山下几乎不可见)
    const snowAlt=Math.max(0.12, Math.min(1, (getTerrainHeight(px,pz)-40)/140));
    snowMat.uniforms.uOpacity.value=Math.min(0.92, 1.6*w.snowAlpha*snowAlt)*(1-(gameState.golden||0)*0.55)*(0.60+0.40*w.snowAlpha);  // [金霞] 霞光里雪点减半

    // 寒冷 + 温度
    const h=getTerrainHeight(px, pz);
    const hf=Math.max(0, Math.min(1, (h-30)/220));
    gameState.cold=Math.min(100, gameState.cold+delta*hf*0.3*w.coldMult);
    // [FIX] 体温改为"环境温度目标 + 渐进趋近", 篝火/风寒都能真正作用
    const envTemp=Math.max(30, 42-hf*20-gameState.cold*0.15);
    gameState.bodyTemp+=(envTemp-gameState.bodyTemp)*Math.min(1, delta*0.12);
    gameState.bodyTemp=Math.max(30, Math.min(42, gameState.bodyTemp));
    bonfires.forEach(b=>{
        const d=b.position.distanceTo(gameState.position);
        if(d<5){
            gameState.bodyTemp=Math.min(42, gameState.bodyTemp+delta*2.5);   // 篝火直接回温
            gameState.cold=Math.max(0, gameState.cold-delta*20);
        }
    });

    document.getElementById('frostOverlay').style.opacity=Math.max(0, gameState.cold/100)*0.7;

    const breath=document.getElementById('breathFog');
    const breathCtx=breath.getContext('2d');
    const showBreath=gameState.cold>35||gameState.bodyTemp<35;
    if(showBreath&&Math.random()>0.9){
        breathCtx.clearRect(0,0,70,45);
        breathCtx.fillStyle=`rgba(255,255,255,${0.12+gameState.cold/350})`;
        breathCtx.beginPath();
        breathCtx.arc(35+Math.sin(gameState.time*2.5)*10, 22+Math.cos(gameState.time*2)*6, 14+gameState.cold*0.1, 0, Math.PI*2);
        breathCtx.fill();
    }
    breath.style.opacity=showBreath?0.7:0;

    // t=0.25 应该是 12:00(正午太阳在顶),所以加 6 小时
    const displayT=(t+0.25)%1;
    const hours=Math.floor(displayT*24), mins=Math.floor((displayT*24%1)*60);
    document.getElementById('gameTime').textContent=(hours<10?'0':'')+hours+':'+(mins<10?'0':'')+mins;
    document.getElementById('coldBar').style.width=gameState.cold+'%';
    document.getElementById('staminaBar').style.width=gameState.stamina+'%';
    const tp=Math.max(0, Math.min(100, (gameState.bodyTemp-30)/12*100));
    document.getElementById('tempBar').style.width=tp+'%';

    const dist=Math.max(0, Math.floor(MOUNTAIN_PEAK-pz));
    document.getElementById('distValue').textContent=dist+'m';

    // === [检查点指引] 玩家此前完全不知道该往哪走 —— 明确给出下一个点: 名字 / 距离 / 方位 ===
    {
        const guide=document.getElementById('cpGuide');
        // 找下一个未到达的检查点(按 id 顺序)
        let next=null;
        for(const cp of CHECKPOINTS){
            if(!gameState.reachedCheckpoints.has(cp.id)){ next=cp; break; }
        }
        if(!next){
            guide.style.display='none';
        }else{
            guide.style.display='block';
            const ddx=next.x-gameState.position.x, ddz=next.z-gameState.position.z;
            const d2=Math.sqrt(ddx*ddx+ddz*ddz);
            document.getElementById('cpName').textContent=next.name;
            document.getElementById('cpDist').innerHTML='还有 <b>'+Math.round(d2*5)+'</b> 米';
            // 方位: 转成相对玩家朝向的指示箭头
            const worldAng=Math.atan2(ddx, ddz);            // 目标在世界中的方位
            let rel=worldAng-gameState.rotation.y;           // 相对视线方向
            while(rel>Math.PI)rel-=Math.PI*2;
            while(rel<-Math.PI)rel+=Math.PI*2;
            const arrows=['↑ 正前方','↗ 右前方','→ 正右方','↘ 右后方','↓ 正后方','↙ 左后方','← 正左方','↖ 左前方'];
            const idx=Math.round(((rel+Math.PI*2)%(Math.PI*2))/(Math.PI/4))%8;
            document.getElementById('cpArrow').textContent=arrows[idx];
        }
        // 到达后旧"距山顶"改显示总进度
    }
    document.getElementById('altitude').textContent='海拔 '+Math.floor(h*5+2500)+'m';

    let tn='硗碛藏族乡';
    if(pz>400)tn='五道拐';
    if(pz>700)tn='烧鸡窝';
    if(pz>1000)tn='筲箕窝';
    if(pz>1300)tn='一支箭';
    if(pz>1600)tn='九坳十三坡';
    if(pz>1900)tn='风雪垭口';
    if(pz>2050)tn='达维 · 王母寨';
    if(pz>2200)tn='雪山之巅';
    if(tn!==gameState.terrainName){
        gameState.terrainName=tn;
        document.getElementById('terrainName').textContent=tn;
    }

    CHECKPOINTS.forEach(cp=>{
        if(!gameState.reachedCheckpoints.has(cp.id)){
            const dx=gameState.position.x-cp.x, dz=gameState.position.z-cp.z;
            if(dx*dx+dz*dz<2500){
                gameState.reachedCheckpoints.add(cp.id);
                showSubtitle(`抵达 · ${cp.name}<br><br>${cp.desc}`);
            }
        }
    });

    // 罗盘
    const cc=document.getElementById('compassCanvas');
    const cctx=cc.getContext('2d');
    cctx.clearRect(0,0,64,64);
    cctx.save();
    cctx.translate(32,32);
    cctx.rotate(-gameState.rotation.y);
    cctx.strokeStyle='rgba(180,160,130,0.4)';
    cctx.lineWidth=1;
    cctx.beginPath(); cctx.arc(0,0,28,0,Math.PI*2); cctx.stroke();
    cctx.fillStyle='#d4c4a8';
    cctx.font='bold 10px serif';
    cctx.textAlign='center';
    cctx.fillText('N',0,-20); cctx.fillText('S',0,22);
    cctx.fillText('W',-20,4); cctx.fillText('E',20,4);
    cctx.fillStyle='#ff4444';
    cctx.beginPath(); cctx.moveTo(0,-24); cctx.lineTo(-5,-10); cctx.lineTo(5,-10); cctx.fill();
    cctx.restore();

    updateChunks();

    mapUpdateTimer+=delta;
    if(mapUpdateTimer>0.2){
        mapUpdateTimer=0;
        updateMiniMap();
    }

    renderer.render(scene, camera);

    if(gameState.reachedCheckpoints.has(3) && !gameState.reachedSummit){
        gameState.reachedSummit=true;
        showSubtitle('历经千辛万苦,红军终于翻越了夹金山!<br><br>这座被当地藏族同胞称为"神山"的雪山,<br>见证了红军战士钢铁般的意志!');
    }
    if(gameState.bodyTemp<33 && !gameState.reachedSummit){
        if(Math.random()<0.005) showSubtitle('体温过低!快找个避风处休息!');
    }
    if(gameState.stamina<8 && !gameState.reachedSummit){
        if(Math.random()<0.005) showSubtitle('体力不支!需要停下来休息恢复体力!');
    }

    if(gameState.weatherId==='blizzard'){
        howlTimer-=delta;
        if(howlTimer<=0){
            howlTimer=30+Math.random()*30;
            playHowl();
        }
    }
    playWind(w.wind);
}

window.addEventListener('resize', ()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    applyResolution();   // [3K] 按档位 + 自适应缩放
});

gameState.gameStarted=true;
setTimeout(()=>{
    loadingScreen.style.opacity='0';
    setTimeout(()=>{loadingScreen.style.display='none';}, 1000);
}, 500);

requestAnimationFrame(animate);
window.__dbg={gameState,scene,camera,renderer,getTerrainHeight,PERF};
</script>
</body>
</html>
